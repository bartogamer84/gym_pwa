<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymProgress PWA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
</head>
<body>
    <header>
        <h1>Mis Rutinas</h1>
    </header>

    <div class="app">
        <!-- Chatbot: floating bubble + panel -->
        <div id="chatBubble" class="chat-bubble" title="Abrir CoachBot">🤖</div>

        <div id="chatbot" class="chatbot hidden">
            <div class="chatbot-header">
                <h3>🤖 CoachBot</h3>
                <button id="chatClose" class="small-btn">✕</button>
            </div>

            <div id="chatMessages" class="chat-messages"></div>

            <div class="chat-input">
                <input 
                type="text" 
                id="chatInput" 
                placeholder="Pregunta algo sobre tu entrenamiento..."
                />
                <button id="chatSend">Enviar</button>
            </div>
        </div>
    </div>

    <main id="app">
        </main>

    <!-- Payment Section -->
    <div id="payment-section" style="display: none;">
        <h2>Realizar Pago</h2>
        <form id="payment-form">
            <div id="payment-element"></div>
            <button id="submit">Pagar $50.00</button>
            <div id="error-message"></div>
        </form>
    </div>

    <script src="app.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
</body>
</html>
